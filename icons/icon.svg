<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5aa8"/>
      <stop offset="1" stop-color="#28316b"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#ead9ad"/>
    </linearGradient>
    <mask id="crescent">
      <circle cx="56" cy="72" r="28" fill="#fff"/>
      <circle cx="69" cy="62" r="23" fill="#000"/>
    </mask>
  </defs>
  <!--
    右上の角を折り返したページ（＝ターンダウンしたシーツ）。
    128.png は Chrome Web Store の規定に合わせ、128 のうち 96 を使って周囲 16 を透明の余白にする。
    16.png と 48.png は小さく見えないよう、viewBox="14 14 100 100" で余白を詰めて書き出す。
  -->
  <path d="M36 16 H76 L112 52 V92 Q112 112 92 112 H36 Q16 112 16 92 V36 Q16 16 36 16 Z" fill="url(#night)"/>
  <path d="M76 16 V42 Q76 52 86 52 H112 Z" fill="url(#fold)"/>
  <rect x="16" y="16" width="96" height="96" fill="#ffdc7c" mask="url(#crescent)"/>
</svg>
